server.port=8081
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl



# CORS (frontend)
app.cors.allowed-origins=http://localhost:5173

# Mostrar el mensaje real del error en la respuesta
# Spring Boot 4: server.error.* quedó obsoleto (se ignora), ahora es spring.web.error.*
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#==================================================
# JWT (AuthController + JwtTokenUtil + JwtAuthenticationFilter)
#==================================================
# Sin valor por defecto: definir JWT_SECRET como variable de entorno.
# Debe ser IGUAL al de service-requerimiento.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# ─── Fix TLS para Java 21 + SQL Server 2008 R2 ───────────────────────────────
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.jvm.additional-args=-Djdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2

