# SQL Server - SQL Server Authentication
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Respetar exactamente los nombres de SQL Server
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Mostrar el mensaje real del Error en la respuesta
server.error.include-message=always
server.error.include-binding-errors=always

#==================================================
# JWT (validar el token de service-user-auth)
#==================================================
# Sin valor por defecto: definir JWT_SECRET como variable de entorno.
# Debe ser IGUAL al de service-user-auth (valida el mismo token).
app.jwt.secret=${JWT_SECRET}

#==================================================
# ADJUNTOS (registro de requerimientos)
#==================================================
# Carpeta donde se guardan FileReqN{id}.ext (los temporales van en {dir}/tmp)
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
